services:
  auth-proxy:
    build: ./auth-proxy
    container_name: auth-proxy
    ports:
      - "8080:8080"
    environment:
      - WEBTOP_URL=http://webtop:3000
      - SESSION_SECRET=${SESSION_SECRET}
      - PORT=8080
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./auth-proxy/db:/app/db
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - webtop
    restart: unless-stopped

  webtop:
    build: ./webtop
    container_name: webtop
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
    volumes:
      - webtop-config:/config
      - ./static-web/selkies-dashboard:/usr/share/selkies/selkies-dashboard
    # 가상 웹캠(v4l2loopback) 장치 매핑은 docker-compose.camera.yml 오버레이로 분리.
    #   카메라 기능을 쓸 때만(= Linux 호스트에서 모듈 로드 후):
    #     docker compose -f docker-compose.yml -f docker-compose.camera.yml up --build
    # NOT exposed to host — only accessible through auth-proxy
    restart: unless-stopped

volumes:
  webtop-config:
